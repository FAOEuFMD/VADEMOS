<!DOCTYPE html>
<html>
<head>
    <style>
        .footer-container {
            padding: 10px 20px;
            color: #000000;
            background-color: #F7F8F9;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .footer-left {
            display: flex;
            align-items: center;
            gap: 30px;
            flex: 1;
        }
        .footer-logo {
            flex-shrink: 0;
        }
        .footer-text {
            display: flex;
            flex-direction: column;
        }
        .footer-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #000000;
        }
        .footer-subtitle {
            font-size: 14px;
            color: #000000;
        }
        .footer-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .footer-links a {
            color: #5792c9;
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
        }
        .footer-links a:hover {
            text-decoration: underline;
            color: #1C4767;
        }
        .footer-bottom {
            width: 100%;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #8a8a8a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .footer-policy {
            font-size: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .footer-policy a {
            color: #5792c9;
            text-decoration: none;
        }
        .footer-policy a:hover {
            text-decoration: underline;
            color: #1C4767;
        }
        .footer-divider {
            color: #8a8a8a;
        }
        .footer-copyright {
            font-size: 13px;
            color: #000000;
        }
        @media (max-width: 768px) {
            .footer-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .footer-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .footer-links {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .footer-bottom {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div style="border-bottom: 2px solid #d0d0d0; width: 100%; margin-bottom: 0;"></div>
    <div class="footer-container" style="flex-direction: column; align-items: stretch; position: relative;">
        <div style="display: flex; width: 100%; align-items: flex-start; justify-content: center; position: relative;">
            <div style="flex: 1;"></div>
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div style="display: flex; justify-content: center; gap: 25px; align-items: center; width: 100%;">
                    <a class="vademos-footer-link" href="https://www.fao.org" target="_blank" style="color: #5792c9 !important;">FAO Website</a>
                    <a class="vademos-footer-link" href="https://www.fao.org/eufmd" target="_blank" style="color: #5792c9 !important;">EuFMD Website</a>
                    <a class="vademos-footer-link" href="https://forms.office.com/e/yAY1SsSJsk" target="_blank" style="color: #5792c9 !important;">Contact Us</a>
                </div>
                <div class="footer-policy" style="margin: 8px 0 0 0; display: flex; flex-direction: row; gap: 15px; justify-content: center; align-items: center; width: 100%;">
                    <a class="vademos-footer-link" href="https://www.fao.org/contact-us/terms/en/" target="_blank" style="color: #5792c9 !important;">Terms and Conditions</a>
                    <span class="footer-divider">|</span>
                    <a class="vademos-footer-link" href="https://fao.org/contact-us/data-protection-and-privacy/en/" target="_blank" style="color: #5792c9 !important;">Data Protection and Privacy</a>
                    <span class="footer-divider">|</span>
                    <a class="vademos-footer-link" href="https://www.fao.org/contact-us/scam-alert/en/" target="_blank" style="color: #5792c9 !important;">Scam Alert</a>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 24px; min-width: 320px;">
                <span style="color: #000; font-size: 13px; white-space: nowrap; text-align: right;">© <script>document.write(new Date().getFullYear())</script> FAO EuFMD - European Commission for the Control of Foot-and-Mouth Disease</span>
                <div class="footer-logo" style="align-self: flex-end;">
                    <img src="EU_black.png" height="50px" alt="EU Logo">
                </div>
            </div>
        </div>
        <style>
            .vademos-footer-link {
                color: #5792c9 !important;
                background: none;
                padding: 2px 6px;
                border-radius: 3px;
                transition: background 0.2s, color 0.2s;
                text-decoration: none;
                font-size: 14px;
            }
            .vademos-footer-link:hover {
                background: #eaf2fa;
                color: #1C4767 !important;
            }
        </style>
    </div>
</body>
</html>
